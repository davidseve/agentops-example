datasciencecluster:
  name: default-dsc
  components:
    dashboard:
      managementState: Managed
    llamastackoperator:
      # Must be Managed: dashboard.genAiStudio (below) self-gates the gen-ai-ui
      # micro-frontend on requiredComponents:[LLAMA_STACK_OPERATOR] (ADR-0008,
      # constraint #23). Was "Removed" here, contradicting the ADR and leaving
      # LlamaStackOperatorReady permanently False / genAiStudio non-functional
      # despite `make validate` requiring it — found 2026-08-05 during a
      # from-scratch redeploy test (masked previously because a stale DSC
      # from an earlier, differently-valued deploy was already Managed).
      managementState: Managed
    mlflowoperator:
      managementState: Managed
    trustyai:
      managementState: Managed
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: allow
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headed
      wva:
        managementState: Removed
    modelsAsService:
      managementState: Managed
    aipipelines:
      managementState: Removed
    feastoperator:
      managementState: Removed
    kueue:
      managementState: Removed
    modelregistry:
      managementState: Removed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Removed
    trainer:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    sparkoperator:
      managementState: Removed
    workbenches:
      managementState: Removed

dashboard:
  crEnabled: true
  genAiStudio: true
  modelAsService: true
  disablePerformanceMetrics: true
  disableModelCatalog: true
  disableModelRegistry: true
