# Service with serving-cert annotation for auto-TLS (oauth-proxy terminates TLS itself)
apiVersion: v1
kind: Service
metadata:
  name: oauth-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: oauth-proxy
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: oauth-proxy-tls
spec:
  type: ClusterIP
  selector:
    app: oauth-proxy
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
