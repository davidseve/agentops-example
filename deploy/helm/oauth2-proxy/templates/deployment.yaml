# oauth-proxy Deployment for OpenClaw Control UI browser auth.
# Uses OpenShift's oauth-proxy fork with --provider=openshift (SA-based OAuth).
#
# hostAlias resolves the upstream hostname to the openshell Service ClusterIP
# so oauth-proxy can reach the gateway directly without routing through
# the external Route (which would loop back to this proxy).
{{- $openshellSvc := lookup "v1" "Service" .Values.namespace "openshell" }}
{{- if not $openshellSvc }}
{{- fail (printf "Service 'openshell' not found in namespace '%s' — deploy OpenShell first" .Values.namespace) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: oauth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-proxy
  template:
    metadata:
      labels:
        app: oauth-proxy
    spec:
      serviceAccountName: openclaw-ui-oauth-proxy
      hostAliases:
        - ip: {{ $openshellSvc.spec.clusterIP }}
          hostnames:
            - openclaw-gw--openclaw-ui.{{ .Values.appsDomain }}
      containers:
        - name: oauth-proxy
          image: {{ .Values.image }}
          args:
            - --provider=openshift
            - --openshift-service-account=openclaw-ui-oauth-proxy
            - --upstream=https://openclaw-gw--openclaw-ui.{{ .Values.appsDomain }}:8080
            - --ssl-insecure-skip-verify=true
            - --upstream-ca=/etc/openshell/ca.crt
            - --https-address=:8443
            - --http-address=
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --cookie-expire=168h
            - --cookie-refresh=1h
            - --email-domain=*
            - --pass-host-header=true
            - --pass-user-headers=true
            - --pass-access-token=true
            - --skip-provider-button=true
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: session-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
            - name: openshell-ca
              mountPath: /etc/openshell
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: oauth-proxy-tls
        - name: session-secret
          secret:
            secretName: oauth-proxy-session-secret
        - name: openshell-ca
          secret:
            secretName: openshell-server-tls
            items:
              - key: ca.crt
                path: ca.crt
