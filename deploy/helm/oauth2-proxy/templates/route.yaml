# Route for the OpenClaw Control UI protected by OpenShift-native OAuth.
# Browsers authenticate against OCP's own OAuth server via oauth-proxy.
# Host uses OpenShell's {sandbox}--{service} routing pattern to work around
# a WebSocket Host-header bug in the OpenShift oauth-proxy fork.
# TLS: reencrypt (oauth-proxy terminates TLS via service-CA-issued cert)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw-ui-auth
  namespace: {{ .Values.namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 3600s
spec:
  host: openclaw-gw--openclaw-ui.{{ .Values.appsDomain }}
  to:
    kind: Service
    name: oauth-proxy
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
