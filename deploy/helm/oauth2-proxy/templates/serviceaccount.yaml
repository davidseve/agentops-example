# ServiceAccount acting as the OAuth client for oauth-proxy's `openshift` provider.
# The annotation registers the Route as a valid redirect URI via the
# OAuthRedirectReference mechanism — no cluster-scoped OAuthClient required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-ui-oauth-proxy
  namespace: {{ .Values.namespace }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"openclaw-ui-auth"}}
