# nginx config for mTLS bridge to OpenShell relay.
# Listens on HTTP :8090 (loopback only) and proxies to the relay with client
# certificates. Binding to 127.0.0.1 restricts this bridge to the oauth-proxy
# container in the same Pod (shared network namespace) — without this, any
# other pod in the cluster could reach the mTLS bridge directly via the Pod
# IP and skip oauth-proxy's OAuth check entirely (no Service/Route exposes
# :8090, but that alone does not block Pod-IP-level traffic).
{{- $openshellSvc := lookup "v1" "Service" .Values.namespace "openshell" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-proxy-nginx-config
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 256;
    }

    http {
      access_log /dev/stdout;
      client_max_body_size 10m;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # WebSocket upgrade support
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      server {
        listen 127.0.0.1:8090;

        location / {
          proxy_pass https://{{ $openshellSvc.spec.clusterIP }}:8080;
          proxy_ssl_certificate /etc/openshell-client/tls.crt;
          proxy_ssl_certificate_key /etc/openshell-client/tls.key;
          proxy_ssl_trusted_certificate /etc/openshell-ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name openclaw-gw--openclaw-ui.{{ .Values.appsDomain }};

          proxy_set_header Host openclaw-gw--openclaw-ui.{{ .Values.appsDomain }};
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host openclaw-gw--openclaw-ui.{{ .Values.appsDomain }};

          # WebSocket support
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
