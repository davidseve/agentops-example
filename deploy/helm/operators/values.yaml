rhoai:
  enabled: true
  namespace: redhat-ods-operator
  channel: stable-3.4
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Manual approval ensures no unreviewed upgrades land on the cluster.
  # The Makefile auto-approves the InstallPlan for the pinned channel/version
  # (the human review already happened when the channel was set in git).
  installPlanApproval: Manual
