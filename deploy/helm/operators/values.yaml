rhoai:
  enabled: true
  namespace: redhat-ods-operator
  channel: stable-3.4
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Manual approval ensures no unreviewed upgrades land on the cluster.
  # The Makefile auto-approves the InstallPlan for the pinned channel/version
  # (the human review already happened when the channel was set in git).
  installPlanApproval: Manual

agentSandbox:
  enabled: true
  namespace: agent-sandbox-system
  channel: preview-0.9
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  # Pin CSV for reproducibility (ADR-0006). Confirmed on OCP 4.20.8 / redhat-operators
  # catalog 2026-08-06: agent-sandbox-operator.v0.9.0 (OSC 1.13 Technology Preview).
  startingCSV: agent-sandbox-operator.v0.9.0
