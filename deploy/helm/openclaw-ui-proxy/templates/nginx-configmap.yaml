# nginx config: TLS termination for the Route + mTLS to the OpenShell relay.
# Listens on :8443 with the OpenShift service-serving certificate.
{{- $svcName := .Values.openshellServiceName | default "openshell" }}
{{- $openshellSvc := lookup "v1" "Service" .Values.namespace $svcName }}
{{- if not $openshellSvc }}
{{- fail (printf "Service '%s' not found in namespace '%s' (set openshellServiceName to the OpenShell Helm release name)" $svcName .Values.namespace) }}
{{- end }}
{{- $uiHost := printf "%s--openclaw-ui.%s" .Values.sandboxName .Values.appsDomain }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-ui-proxy-nginx-config
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 256;
    }

    http {
      access_log /dev/stdout;
      client_max_body_size 10m;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      server {
        listen 8443 ssl;
        server_name {{ $uiHost }};

        ssl_certificate     /etc/tls/private/tls.crt;
        ssl_certificate_key /etc/tls/private/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
          proxy_pass https://{{ $openshellSvc.spec.clusterIP }}:8080;
          proxy_ssl_certificate /etc/openshell-client/tls.crt;
          proxy_ssl_certificate_key /etc/openshell-client/tls.key;
          proxy_ssl_trusted_certificate /etc/openshell-ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ $uiHost }};

          # OpenShell service routing keys off Host: {sandbox}--{service}.{domain}
          proxy_set_header Host {{ $uiHost }};
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host {{ $uiHost }};

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
