# Service with serving-cert annotation so OpenShift mints TLS for nginx (:8443).
apiVersion: v1
kind: Service
metadata:
  name: openclaw-ui-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: openclaw-ui-proxy
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: openclaw-ui-proxy-tls
spec:
  type: ClusterIP
  selector:
    app: openclaw-ui-proxy
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
