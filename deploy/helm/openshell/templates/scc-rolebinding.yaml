{{- if .Values.openshift.scc.privilegedSandbox }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentops-openshell.fullname" . }}-sandbox-privileged-scc
  # .Release.Namespace: since 2026-08-05 this chart installs the OpenShell
  # gateway as a real subchart dependency in a single release with
  # --namespace openshell, so this now correctly resolves to "openshell" —
  # no longer needs the .Values.namespace workaround from the earlier
  # two-release split (see Chart.yaml history note). Applied as a normal
  # resource (no post-install hook needed either): the referenced
  # ServiceAccount subject doesn't need to pre-exist for the RoleBinding
  # itself to apply successfully, and both are now part of the same release.
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentops-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ include "agentops-openshell.sandboxSA" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
