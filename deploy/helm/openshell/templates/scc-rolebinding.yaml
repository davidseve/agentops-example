{{- if .Values.openshift.scc.privilegedSandbox }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentops-openshell.fullname" . }}-sandbox-privileged-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentops-openshell.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ include "agentops-openshell.sandboxSA" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
