{{- if .Values.openshift.scc.privilegedSandbox }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentops-openshell.fullname" . }}-sandbox-privileged-scc
  # .Values.namespace (fixed "openshell"), not .Release.Namespace: this release
  # (openshell-infra) isn't installed with --namespace, but the sandbox SA this
  # binds actually lives in "openshell" — see namespace.yaml for the full
  # explanation of this pattern.
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentops-openshell.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ include "agentops-openshell.sandboxSA" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
