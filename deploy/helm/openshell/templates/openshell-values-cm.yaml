{{- if not .Values.global.appsDomain }}
{{- fail "global.appsDomain is required (e.g., apps.ocp.sandbox701.opentlc.com)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-helm-values
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: agentops-example
  annotations:
    agentops-example/purpose: "Rendered values for the OCI OpenShell Helm chart install"
data:
  values.yaml: |
    replicaCount: {{ .Values.openshell.replicaCount }}

    workload:
      kind: {{ .Values.openshell.workload.kind }}

    image:
      tag: {{ .Values.openshell.image.tag | quote }}

    supervisor:
      image:
        tag: {{ .Values.openshell.supervisor.image.tag | quote }}

    podSecurityContext:
      fsGroup: null

    securityContext:
      runAsUser: null

    pkiInitJob:
      serverDnsNames:
        - "{{ .Values.route.name }}-{{ .Values.namespace }}.{{ .Values.global.appsDomain }}"
        - "*.{{ .Values.global.appsDomain }}"

    server:
      auth:
        allowUnauthenticatedUsers: {{ .Values.openshell.server.auth.allowUnauthenticatedUsers }}
