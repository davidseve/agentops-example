apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-{{ .Values.scc.serviceAccount }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ .Values.scc.serviceAccount }}
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.scc.sccName }}
