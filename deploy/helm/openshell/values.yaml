# Default values for agentops-openshell.
# Upstream chart values are nested under the `openshell` alias (see Chart.yaml).

# --- Wrapper-level settings ---

openshift:
  namespace:
    create: false
  scc:
    privilegedSandbox: false
    serviceAccount: ""

# --- Upstream subchart overrides ---

openshell:
  # Pin images to match chart appVersion (0.0.80).
  image:
    repository: ghcr.io/nvidia/openshell/gateway
    tag: "0.0.80"
    pullPolicy: IfNotPresent

  supervisor:
    image:
      repository: ghcr.io/nvidia/openshell/supervisor
      tag: "0.0.80"

  # TLS + certgen hook (default). Do not disable pkiInitJob on OpenShift.
  # See: https://github.com/NVIDIA/OpenShell/issues/2089
  server:
    disableTls: false
    sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
    logLevel: info

  pkiInitJob:
    enabled: true

  replicaCount: 1
  workload:
    kind: statefulset

  service:
    type: ClusterIP
    port: 8080

  networkPolicy:
    enabled: true

# --- OpenClaw Gateway Route (Service + Route for HTTP access to sandbox gateway) ---
openclawGateway:
  enabled: true
  sandboxNameHash: "171028ef"

# Namespace (used by templates)
namespace: openshell

# Route (existing gRPC route for openshell CLI)
route:
  enabled: true
  name: openshell-gw
  targetPort: grpc
  tlsTermination: passthrough

global:
  appsDomain: ""
