# Default values for agentops-openshell (OpenShift / RHOAI only).
# Upstream chart values are nested under the `openshell` alias (see Chart.yaml
# `dependencies[].alias`) and passed straight through to the real OpenShell
# subchart dependency rendered as part of this same release.
#
# Validated on OpenShift 4.x with SCC restricted (gateway) + privileged (sandboxes).
#
# Prerequisites (not installed by this chart):
#   - Red Hat build of Agent Sandbox Operator: deploy/helm/operators/ (make deploy-operators)
#
# Namespace creation is NOT done by this chart (see deploy/Makefile's
# deploy-openshell target: `helm upgrade --install ... --create-namespace`).
# A chart-owned Namespace template combined with --create-namespace makes
# Helm refuse to adopt the pre-existing namespace on a truly fresh install
# ("exists and cannot be imported... invalid ownership metadata") — so
# namespace creation is left to the Helm flag, and the one extra label this
# project needs (RHOAI dashboard opt-in) is applied by a single idempotent
# `oc label` line in the same Makefile target instead.

# --- Wrapper-level settings ---

openshift:
  scc:
    privilegedSandbox: true
    # Left unset by default: the `agentops-openshell.sandboxSA` helper
    # (templates/_helpers.tpl) already defaults to "<release name>-sandbox",
    # and this chart is always installed with release name "openshell" (see
    # deploy/Makefile), so it resolves to "openshell-sandbox" automatically —
    # matching the sandbox ServiceAccount the subchart itself creates. Only
    # set this to override if the release is ever installed under a
    # different name.
    serviceAccount: ""

# --- Upstream subchart overrides (alias: openshell) ---

openshell:
  # The version actually installed is pinned in Chart.yaml's
  # `dependencies[].version` + Chart.lock (Helm's own dependency-pinning
  # mechanism) — that is the single source of truth per
  # docs/adr/0006-explicit-version-pinning.md. Keep these tags in sync with
  # that version; a mismatch here silently pins the wrong image tag even
  # though the chart itself was correctly resolved.
  image:
    repository: ghcr.io/nvidia/openshell/gateway
    tag: "0.0.83"
    pullPolicy: IfNotPresent

  supervisor:
    image:
      repository: ghcr.io/nvidia/openshell/supervisor
      tag: "0.0.83"

  # TLS + certgen hook (default). Do not disable pkiInitJob on OpenShift.
  # See: https://github.com/NVIDIA/OpenShell/issues/2089
  server:
    disableTls: false
    sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
    logLevel: info
    auth:
      # Gateway's own CLI/gRPC endpoint is mTLS-only (client cert required, see
      # openshell-client-tls secret) — "unauthenticated" means no *additional*
      # bearer token on top of the client cert, not open access. Was previously
      # unset here (no default at all), which made `helm template` fail outright
      # with a nil-pointer error — found and fixed 2026-08-05 while redeploying
      # from scratch. See docs/adr/0003-openshell-deployment-on-openshift.md.
      allowUnauthenticatedUsers: true

  pkiInitJob:
    enabled: true

  replicaCount: 1
  workload:
    kind: statefulset

  service:
    type: ClusterIP
    port: 8080

  networkPolicy:
    enabled: true

  # Let OpenShift SCC admission assign UID and fsGroup.
  podSecurityContext:
    fsGroup: null

  securityContext:
    runAsUser: null

# Route (existing gRPC route for openshell CLI)
route:
  enabled: true
  name: openshell-gw
  targetPort: grpc
  tlsTermination: passthrough

global:
  appsDomain: ""
