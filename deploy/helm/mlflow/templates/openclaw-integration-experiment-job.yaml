{{- if .Values.openclawIntegration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-mlflow-experiment-{{ .Release.Revision }}
  namespace: {{ .Values.openclawIntegration.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: agentops-example
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "mlflow.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: create-experiment
          image: {{ .Values.openclawIntegration.jobImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              TOKEN=$(cat /var/run/secrets/mlflow-token/token)
              MLFLOW_URL="https://mlflow.{{ .Values.openclawIntegration.mlflowNamespace }}.svc:8443"
              WORKSPACE="{{ .Values.openclawIntegration.namespace }}"
              EXP_NAME="{{ .Values.openclawIntegration.experimentName }}"

              RESP=$(curl -sk \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "X-MLFLOW-WORKSPACE: ${WORKSPACE}" \
                "${MLFLOW_URL}/api/2.0/mlflow/experiments/get-by-name?experiment_name=${EXP_NAME}")
              EXP_ID=$(echo "$RESP" | grep -o '"experiment_id"[[:space:]]*:[[:space:]]*"[0-9]*"' | grep -o '[0-9]*' | head -1)

              if [ -z "$EXP_ID" ]; then
                RESP=$(curl -sk -X POST \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "X-MLFLOW-WORKSPACE: ${WORKSPACE}" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\": \"${EXP_NAME}\"}" \
                  "${MLFLOW_URL}/api/2.0/mlflow/experiments/create")
                EXP_ID=$(echo "$RESP" | grep -o '"experiment_id"[[:space:]]*:[[:space:]]*"[0-9]*"' | grep -o '[0-9]*' | head -1)
              fi

              if [ -z "$EXP_ID" ]; then
                echo "ERROR: could not get-or-create experiment. Last response: $RESP" >&2
                exit 1
              fi
              echo "experiment_id=${EXP_ID}"
          volumeMounts:
            - name: mlflow-token
              mountPath: /var/run/secrets/mlflow-token
              readOnly: true
      volumes:
        - name: mlflow-token
          secret:
            secretName: {{ .Values.openclawIntegration.serviceAccountName }}-mlflow-token
{{- end }}
