service:
  name: maas-db
namespace: redhat-ods-applications
port: 5432

image:
  repository: registry.redhat.io/rhel9/postgresql-16
  tag: latest

database:
  name: maas
  user: maas
  password: maas-eval-password
  adminPassword: maas-admin-password
  extraDatabases:
    - mlflow
    - evalhub

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
