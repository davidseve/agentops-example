<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>Test C — curl google.com</title>
<link rel="stylesheet" href="../shared/vendor/style.css">
<link rel="stylesheet" href="../shared/demo.css">
</head>
<body>

<button class="fs-theme-toggle" id="fs-theme" title="Toggle theme">&#9790;</button>

<div class="fs-brand" id="fs-brand"></div>
<div class="fs-header-stack" id="fs-header-stack">
  <div class="fs-title" id="fs-title"></div>
  <div class="fs-tagline" id="fs-tagline">Your Agent. Our Platform. Production-Ready.</div>
</div>

<nav class="fs-scenario-nav" aria-label="Scenario diagrams"></nav>

<div class="fs-panel">
  <div class="fs-flow-bar">
    <div class="fs-mode-toggle" id="fs-mode-toggle">
      <button type="button" data-fs-mode="before" class="active">Before</button>
      <button type="button" data-fs-mode="after">After</button>
    </div>
    <div class="fs-flow-nav">
      <select id="fs-flow-select"></select>
      <button id="fs-prev" title="Previous hop">&#9664;</button>
      <button class="fs-start" id="fs-play">&#9654; Start</button>
      <button id="fs-next" title="Next hop">&#9654;</button>
    </div>
    <button id="fs-speed">1x</button>
    <button id="fs-loop">&#8635; Loop</button>
    <button class="fs-reset" id="fs-reset">Reset</button>
  </div>
  <div class="fs-steps" id="fs-steps">
    <div class="fs-steps-title">Layers <span class="fs-steps-hint">· 1/2 or b/a = Before/After</span></div>
    <div id="fs-steps-container"></div>
  </div>
  <div class="fs-inspector" id="fs-inspector">
    <div class="fs-inspector-title" id="fs-inspector-title">Layer board</div>
    <div id="fs-inspector-content"></div>
  </div>
</div>

<div id="fs-highlight-box"></div>
<div id="fs-overlay" onclick="if(event.target===this)window.__flowstory?.closeOverlay()">
  <div id="fs-overlay-card">
    <button id="fs-overlay-close" type="button" aria-label="Close">✕</button>
    <div id="fs-overlay-accent"></div>
    <h2 id="fs-overlay-title"></h2>
    <p id="fs-overlay-desc"></p>
    <div id="fs-overlay-details"></div>
    <button id="fs-overlay-resume" type="button">&#9654; Resume</button>
  </div>
</div>

<div class="fs-legend" id="fs-legend"></div>
<div class="fs-credit-scenario"><a href="../index.html">launcher</a> · <a href="../overall-demo-architecture.html">overall map</a></div>

<canvas id="fs-canvas"></canvas>

<script type="module">
import {
  COLORS,
  LAYER_NAMES,
  OVERALL_CANVAS,
  pickNodes,
  mergeResponseBodies,
  initScenarioDiagram,
} from "./shared-scenario.js";
import {
  RESPONSES_C_BEFORE,
  OVERLAYS_C_BEFORE,
  RESPONSES_C_AFTER,
  OVERLAYS_C_AFTER,
} from "./scenario-responses.js";
import {
  SCENARIO_C_BEFORE_STEPS,
  SCENARIO_C_AFTER_STEPS,
  SCENARIO_C_BEFORE_MUTATIONS,
  SCENARIO_C_AFTER_MUTATIONS,
  LAYER_BOARDS,
} from "./overall-flows.js";

const mergedMutationsBefore = mergeResponseBodies(
  SCENARIO_C_BEFORE_MUTATIONS,
  RESPONSES_C_BEFORE
);
const mergedMutationsAfter = mergeResponseBodies(SCENARIO_C_AFTER_MUTATIONS, RESPONSES_C_AFTER);

const diagram = {
  meta: {
    title: "Test C — curl google.com",
    branding: {
      logo: "../shared/assets/redhat-logo.svg",
      title: "Red Hat",
    },
  },
  canvas: OVERALL_CANVAS,
  nodes: pickNodes(["user", "openshell", "agentsb", "oc", "gw", "internet"], {
    oc: { sublabel: "curl google.com" },
    gw: { sublabel: "Control UI + egress" },
  }),
  tooltips: {
    user: {
      title: LAYER_NAMES.endUser,
      description: `Auditor prompt via ${LAYER_NAMES.controlUI} — curl reaches OpenClaw through the gateway.`,
    },
    gw: {
      title: LAYER_NAMES.gw,
      description: "User entry to OpenClaw and egress choke point for outbound curl.",
    },
    oc: {
      title: "curl probe",
      description: "curl -sI https://google.com — default.yaml blocks public egress.",
    },
    internet: {
      title: LAYER_NAMES.internet,
      description: "Public internet — risk when egress policy is permissive.",
    },
  },
  flows: {
    before: {
      label: "Before · egress closed",
      steps: SCENARIO_C_BEFORE_STEPS,
    },
    after: {
      label: "After · google allowlisted",
      steps: SCENARIO_C_AFTER_STEPS,
    },
  },
  flowOrder: ["before", "after"],
  defaultFlow: "before",
  inspector: {
    initialStates: {
      before: LAYER_BOARDS["scenario-c-before"],
      after: LAYER_BOARDS["scenario-c-after"],
    },
    mutations: {
      before: SCENARIO_C_BEFORE_MUTATIONS,
      after: SCENARIO_C_AFTER_MUTATIONS,
    },
  },
  legend: [
    { label: `${LAYER_NAMES.endUser} · ${LAYER_NAMES.controlUI}`, color: COLORS.endUser },
    { label: `${LAYER_NAMES.openClaw} · egress`, color: COLORS.oc },
    { label: "Selective egress allowed", color: COLORS.secure },
    { label: "Internet egress", color: COLORS.risk },
    { label: "Denied / blocked", color: COLORS.denied },
  ],
};

const phaseRest = {
  before: {
    glow: ["gw"],
    activeNodes: ["gw", "oc"],
    nodeColors: { gw: COLORS.denied, internet: COLORS.dim },
  },
  after: {
    glow: ["internet"],
    activeNodes: ["oc", "gw", "internet"],
    nodeColors: { internet: COLORS.secure, gw: COLORS.secure },
  },
};

try {
  await initScenarioDiagram(diagram, {
    headerTitle: "Test C — curl google.com",
    modeFlows: { before: "before", after: "after" },
    phaseRest,
    defaultMode: "before",
    showFlowSelect: false,
    activeNavId: "C",
    responseComparison: {
      flows: {
        before: {
          baseMutations: SCENARIO_C_BEFORE_MUTATIONS,
          mergedMutations: mergedMutationsBefore,
          overlays: OVERLAYS_C_BEFORE,
          responseMap: RESPONSES_C_BEFORE,
        },
        after: {
          baseMutations: SCENARIO_C_AFTER_MUTATIONS,
          mergedMutations: mergedMutationsAfter,
          overlays: OVERLAYS_C_AFTER,
          responseMap: RESPONSES_C_AFTER,
        },
      },
      defaultFlowId: "before",
    },
  });
} catch (e) {
  console.error(e);
  document.body.innerHTML = `<pre class="fs-load-error">FlowStory load error\n${e.message}</pre>`;
}
</script>
</body>
</html>
