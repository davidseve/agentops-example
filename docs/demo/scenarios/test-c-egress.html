<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>Test C — Unauthorized curl</title>
<link rel="stylesheet" href="../shared/vendor/style.css">
<link rel="stylesheet" href="../shared/demo.css">
</head>
<body>

<button class="fs-theme-toggle" id="fs-theme" title="Toggle theme">&#9790;</button>

<div class="fs-brand" id="fs-brand"></div>
<div class="fs-header-stack" id="fs-header-stack">
  <div class="fs-title" id="fs-title"></div>
  <div class="fs-tagline" id="fs-tagline">Your Agent. Our Platform. Production-Ready.</div>
</div>

<nav class="fs-scenario-nav" aria-label="Scenario diagrams"></nav>

<div class="fs-panel">
  <div class="fs-flow-bar">
    <div class="fs-mode-toggle" id="fs-mode-toggle">
      <button type="button" data-fs-mode="before" class="active">Before</button>
      <button type="button" data-fs-mode="after">After</button>
    </div>
    <div class="fs-flow-nav">
      <select id="fs-flow-select"></select>
      <button id="fs-prev" title="Previous hop">&#9664;</button>
      <button class="fs-start" id="fs-play">&#9654; Start</button>
      <button id="fs-next" title="Next hop">&#9654;</button>
    </div>
    <button id="fs-speed">1x</button>
    <button id="fs-loop">&#8635; Loop</button>
    <button class="fs-reset" id="fs-reset">Reset</button>
  </div>
  <div class="fs-steps" id="fs-steps">
    <div class="fs-steps-title">Layers <span class="fs-steps-hint">· 1/2 or b/a = Before/After</span></div>
    <div id="fs-steps-container"></div>
  </div>
  <div class="fs-inspector" id="fs-inspector">
    <div class="fs-inspector-title" id="fs-inspector-title">Layer board</div>
    <div id="fs-inspector-content"></div>
  </div>
</div>

<div id="fs-highlight-box"></div>
<div id="fs-overlay" onclick="if(event.target===this)window.__flowstory?.closeOverlay()">
  <div id="fs-overlay-card">
    <button id="fs-overlay-close" type="button" aria-label="Close">✕</button>
    <div id="fs-overlay-accent"></div>
    <h2 id="fs-overlay-title"></h2>
    <p id="fs-overlay-desc"></p>
    <div id="fs-overlay-details"></div>
    <button id="fs-overlay-resume" type="button">&#9654; Resume</button>
  </div>
</div>

<div class="fs-legend" id="fs-legend"></div>
<div class="fs-credit-scenario"><a href="../index.html">launcher</a> · <a href="../overall-demo-architecture.html">overall map</a></div>

<canvas id="fs-canvas"></canvas>

<script type="module">
import {
  COLORS,
  LAYER_NAMES,
  OVERALL_CANVAS,
  pickNodes,
  ARROW,
  mergeResponseBodies,
  initScenarioDiagram,
} from "./shared-scenario.js";
import {
  RESPONSES_C_BEFORE,
  OVERLAYS_C_BEFORE,
  RESPONSES_C_AFTER,
  OVERLAYS_C_AFTER,
} from "./scenario-responses.js";

const baseMutationsBefore = [
  {
    step: 1,
    label: `1  ${LAYER_NAMES.endUser} → ${LAYER_NAMES.gw}`,
    actions: [{ id: "l-user", style: "highlight" }, { id: "l-gw", style: "highlight" }],
  },
  {
    step: 2,
    label: `1  ${LAYER_NAMES.gw} → ${LAYER_NAMES.openClaw}`,
    actions: [{ id: "p-probe", style: "highlight" }],
  },
  { step: 3, label: `2  ${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} · egress` },
  {
    step: 4,
    label: `3  ${LAYER_NAMES.gw} → ${LAYER_NAMES.internet}`,
    actions: [{ id: "l-egress", style: "highlight" }],
  },
  { step: 5, label: "3  Response returns" },
  { step: 6, label: `2  ${LAYER_NAMES.gw} → ${LAYER_NAMES.openClaw}` },
  { step: 7, label: `1  ${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} · output` },
  {
    step: 8,
    label: `1  ${LAYER_NAMES.gw} → ${LAYER_NAMES.endUser} · risk`,
    actions: [{ id: "p-expect", style: "highlight" }],
  },
];

const baseMutationsAfter = [
  {
    step: 1,
    label: `1  ${LAYER_NAMES.endUser} → ${LAYER_NAMES.gw}`,
    actions: [{ id: "l-user", style: "highlight" }, { id: "l-gw", style: "highlight" }],
  },
  {
    step: 2,
    label: `1  ${LAYER_NAMES.gw} → ${LAYER_NAMES.openClaw}`,
    actions: [{ id: "p-probe", style: "highlight" }],
  },
  { step: 3, label: `2  ${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw}` },
  {
    step: 4,
    label: "3  Denied at gateway",
    actions: [{ id: "p-cmd", style: "highlight" }, { id: "l-egress", style: "highlight" }],
  },
  { step: 5, label: `1  ${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} · blocked` },
  {
    step: 6,
    label: `1  ${LAYER_NAMES.gw} → ${LAYER_NAMES.endUser} · denied`,
    actions: [{ id: "p-expect", style: "highlight" }],
  },
];

const mergedMutationsBefore = mergeResponseBodies(baseMutationsBefore, RESPONSES_C_BEFORE);
const mergedMutationsAfter = mergeResponseBodies(baseMutationsAfter, RESPONSES_C_AFTER);

const inspectorHeadersShared = [
  { value: "Credentials     locked", style: "keep", id: "l-creds" },
  {
    value: `User path       ${LAYER_NAMES.controlUI} → GW`,
    style: "keep",
    id: "l-user",
  },
  {
    value: `Gateway         ${LAYER_NAMES.controlUI} bridge`,
    style: "keep",
    id: "l-gw",
  },
  { value: "Filesystem      locked", style: "keep", id: "l-files" },
  { value: "Guardrails      off", style: "keep", id: "l-rails" },
  { value: "MLflow          on (background)", style: "keep", id: "l-mlflow" },
];

const diagram = {
  meta: {
    title: "Test C — Unauthorized curl",
    branding: {
      logo: "../shared/assets/redhat-logo.svg",
      title: "Red Hat",
    },
  },
  canvas: OVERALL_CANVAS,
  nodes: pickNodes(["user", "openshell", "agentsb", "oc", "gw", "internet"], {
    oc: { sublabel: "curl google.com" },
    gw: { sublabel: "Control UI + egress" },
  }),
  tooltips: {
    user: {
      title: LAYER_NAMES.endUser,
      description: `Auditor prompt via ${LAYER_NAMES.controlUI} — curl reaches OpenClaw through the gateway.`,
    },
    gw: {
      title: LAYER_NAMES.gw,
      description: "User entry to OpenClaw and egress choke point for outbound curl.",
    },
    oc: {
      title: "curl probe",
      description: "curl -sI https://google.com — default.yaml blocks public egress.",
    },
    internet: {
      title: LAYER_NAMES.internet,
      description: "Public internet — risk when egress policy is permissive.",
    },
  },
  flows: {
    before: {
      label: "Before · egress closed",
      steps: [
        {
          text: `${LAYER_NAMES.endUser} → ${LAYER_NAMES.gw}`,
          mode: "arrow",
          from: "user",
          to: "gw",
          color: COLORS.endUser,
          num: 1,
          ...ARROW.userToGw,
        },
        {
          text: `${LAYER_NAMES.gw} forwards curl prompt to ${LAYER_NAMES.openClaw}`,
          mode: "arrow",
          from: "gw",
          to: "oc",
          color: COLORS.endUser,
          num: 1,
          ...ARROW.gwToOc,
        },
        {
          text: `${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} · egress attempt`,
          mode: "arrow",
          from: "oc",
          to: "gw",
          color: COLORS.platform,
          num: 2,
          ...ARROW.ocToGw,
        },
        {
          text: `${LAYER_NAMES.gw} denies unauthorized egress`,
          mode: "arrow",
          from: "gw",
          to: "internet",
          color: COLORS.denied,
          num: 3,
          ...ARROW.gwToInternet,
        },
        {
          text: `${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} · blocked`,
          mode: "arrow",
          from: "oc",
          to: "gw",
          color: COLORS.secure,
          num: 1,
          ...ARROW.ocToGwReply,
        },
        {
          text: `${LAYER_NAMES.gw} → ${LAYER_NAMES.endUser} · curl denied`,
          mode: "arrow",
          from: "gw",
          to: "user",
          color: COLORS.secure,
          num: 1,
          ...ARROW.gwToUser,
        },
      ],
    },
    after: {
      label: "After · google allowlisted",
      steps: [
        {
          text: `${LAYER_NAMES.endUser} → ${LAYER_NAMES.gw}`,
          mode: "arrow",
          from: "user",
          to: "gw",
          color: COLORS.endUser,
          num: 1,
          ...ARROW.userToGw,
        },
        {
          text: "Same curl prompt — retry after Cambio 1",
          mode: "arrow",
          from: "gw",
          to: "oc",
          color: COLORS.endUser,
          num: 1,
          ...ARROW.gwToOc,
        },
        {
          text: `${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} · egress`,
          mode: "arrow",
          from: "oc",
          to: "gw",
          color: COLORS.warn,
          num: 2,
          ...ARROW.ocToGw,
        },
        {
          text: `${LAYER_NAMES.gw} forwards to ${LAYER_NAMES.internet} (google.com)`,
          mode: "arrow",
          from: "gw",
          to: "internet",
          color: COLORS.warn,
          num: 3,
          ...ARROW.gwToInternet,
        },
        {
          text: `${LAYER_NAMES.internet} responds (HTTP 200)`,
          mode: "arrow",
          from: "internet",
          to: "gw",
          color: COLORS.warn,
          num: 3,
          ...ARROW.internetToGw,
        },
        {
          text: `${LAYER_NAMES.gw} → ${LAYER_NAMES.endUser} · HTTP 200 visible`,
          mode: "arrow",
          from: "gw",
          to: "user",
          color: COLORS.warn,
          num: 1,
          ...ARROW.gwToUser,
        },
      ],
    },
  },
  flowOrder: ["before", "after"],
  defaultFlow: "before",
  inspector: {
    initialStates: {
      before: {
        headers: [
          ...inspectorHeadersShared.slice(0, 4),
          { value: "Egress          closed (default deny)", style: "highlight", id: "l-egress" },
          ...inspectorHeadersShared.slice(4),
        ],
        body: [
          { value: "curl -sI https://google.com", style: "add", id: "p-probe" },
          { value: "Expected: blocked (timeout / denied)", style: "add", id: "p-expect" },
        ],
      },
      after: {
        headers: [
          ...inspectorHeadersShared.slice(0, 4),
          { value: "Egress          open (google.com)", style: "highlight", id: "l-egress" },
          ...inspectorHeadersShared.slice(4),
        ],
        body: [
          { value: "Cambio 1: ./scripts/demo-allow-google-egress.sh", style: "add", id: "p-cmd" },
          { value: "Same curl → HTTP 200 to google.com", style: "add", id: "p-expect" },
        ],
      },
    },
    mutations: {
      before: baseMutationsBefore,
      after: baseMutationsAfter,
    },
  },
  legend: [
    { label: `${LAYER_NAMES.endUser} · ${LAYER_NAMES.controlUI}`, color: COLORS.endUser },
    { label: `${LAYER_NAMES.openClaw} · egress`, color: COLORS.oc },
    { label: "Open egress (risk)", color: COLORS.warn },
    { label: "Internet egress", color: COLORS.risk },
    { label: "Denied / blocked", color: COLORS.denied },
  ],
};

const phaseRest = {
  before: {
    glow: ["internet"],
    activeNodes: ["internet"],
    nodeColors: { internet: COLORS.warn },
  },
  after: {
    glow: ["gw"],
    activeNodes: ["gw"],
    nodeColors: { gw: COLORS.denied, internet: COLORS.dim },
  },
};

try {
  await initScenarioDiagram(diagram, {
    headerTitle: "Test C — Unauthorized curl",
    modeFlows: { before: "before", after: "after" },
    phaseRest,
    defaultMode: "before",
    showFlowSelect: false,
    activeNavId: "C",
    responseComparison: {
      flows: {
        before: {
          baseMutations: baseMutationsBefore,
          mergedMutations: mergedMutationsBefore,
          overlays: OVERLAYS_C_BEFORE,
          responseMap: RESPONSES_C_BEFORE,
        },
        after: {
          baseMutations: baseMutationsAfter,
          mergedMutations: mergedMutationsAfter,
          overlays: OVERLAYS_C_AFTER,
          responseMap: RESPONSES_C_AFTER,
        },
      },
      defaultFlowId: "before",
    },
  });
} catch (e) {
  console.error(e);
  document.body.innerHTML = `<pre class="fs-load-error">FlowStory load error\n${e.message}</pre>`;
}
</script>
</body>
</html>
