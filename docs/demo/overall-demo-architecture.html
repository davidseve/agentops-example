<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>AgentOps - Platform Architecture</title>
<link rel="stylesheet" href="./shared/vendor/style.css">
<link rel="stylesheet" href="./shared/demo.css">
</head>
<body>

<button class="fs-theme-toggle" id="fs-theme" title="Toggle theme">&#9790;</button>

<div class="fs-brand" id="fs-brand"></div>
<div class="fs-header-stack" id="fs-header-stack">
  <div class="fs-title" id="fs-title"></div>
  <div class="fs-tagline">Your Agent. Our Platform. Production-Ready.</div>
</div>

<nav class="fs-scenario-nav" id="fs-scenario-nav" aria-label="Scenario diagrams"></nav>

<div class="fs-panel">
  <div class="fs-flow-bar">
    <div class="fs-flow-nav">
      <select id="fs-flow-select"></select>
      <button id="fs-prev" title="Previous hop (clicker / ← / Page Up)">&#9664;</button>
      <button class="fs-start" id="fs-play">&#9654; Start</button>
      <button id="fs-next" title="Next hop (clicker / → / Page Down)">&#9654;</button>
    </div>
    <button id="fs-speed">1x</button>
    <button id="fs-loop" style="border-color:#79c0ff;color:#79c0ff">&#8635; Loop</button>
    <button id="fs-response-mode" type="button" title="Cycle messages: Popup near node / Panel / Both">Msgs: Popup</button>
    <button class="fs-reset" id="fs-reset">Reset</button>
  </div>
  <div class="fs-steps" id="fs-steps">
    <div class="fs-steps-title">Layers</div>
    <div id="fs-steps-container"></div>
  </div>
  <div class="fs-inspector" id="fs-inspector">
    <div class="fs-inspector-title" id="fs-inspector-title" style="color:var(--fs-accent)">Layer board</div>
    <div id="fs-inspector-content"></div>
  </div>
</div>

<div id="fs-highlight-box" style="display:none;position:fixed;z-index:350;border-radius:10px;pointer-events:none"></div>
<div id="fs-overlay" onclick="if(event.target===this)window.__flowstory?.closeOverlay()" style="display:none;position:fixed;top:0;left:0;right:380px;bottom:0;z-index:300;background:rgba(0,0,0,0.6)">
  <div id="fs-overlay-card" style="position:absolute;background:#161b22ee;border:1px solid #30363d;border-radius:14px;max-width:420px;padding:22px 26px;box-shadow:0 12px 40px rgba(0,0,0,0.5);transition:opacity .2s">
    <button id="fs-overlay-close" style="position:absolute;top:10px;right:14px;background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px">✕</button>
    <div id="fs-overlay-accent" style="width:4px;height:24px;border-radius:2px;position:absolute;left:0;top:22px"></div>
    <h2 id="fs-overlay-title" style="margin:0 0 6px;font-size:18px;color:#c9d1d9;font-family:system-ui"></h2>
    <p id="fs-overlay-desc" style="margin:0 0 14px;font-size:13px;color:#8b949e;line-height:1.5;font-family:system-ui"></p>
    <div id="fs-overlay-details" style="font-size:12px;font-family:'SF Mono',Menlo,monospace"></div>
    <button id="fs-overlay-resume" style="margin-top:14px;padding:7px 20px;border:1px solid #3fb950;border-radius:8px;background:transparent;color:#3fb950;font-size:13px;cursor:pointer;font-family:system-ui">&#9654; Resume</button>
  </div>
</div>

<div class="fs-legend" id="fs-legend"></div>
<div class="fs-credit">Complete platform · <a href="./index.html">launcher</a></div>

<canvas id="fs-canvas"></canvas>

<script type="module">
import {
  LAYER_NAMES,
  initScenarioDiagram,
  OVERALL_FLOW_SHORTCUTS,
} from './scenarios/shared-scenario.js';
import {
  buildOverallFlows,
  buildOverallMutations,
  buildOverallNodes,
  buildOverallResponseComparison,
  LAYER_BOARDS,
  OVERALL_CANVAS,
  OVERALL_FLOW_ORDER,
  PHASE_REST,
} from './scenarios/overall-flows.js';

const DIRECT_INFERENCE_PATH = `${LAYER_NAMES.ir} → ${LAYER_NAMES.gw} → ${LAYER_NAMES.maas} → ${LAYER_NAMES.llm}`;

const diagram = {
  meta: {
    title: "AgentOps - Platform Architecture",
    branding: {
      logo: "./shared/assets/redhat-logo.svg",
      title: "Red Hat"
    }
  },
  canvas: OVERALL_CANVAS,
  nodes: buildOverallNodes(),
  tooltips: {
    user: {
      title: LAYER_NAMES.endUser,
      description: `The end user reaches ${LAYER_NAMES.openClaw} through the ${LAYER_NAMES.gw} — never a direct hop into the sandbox. ${LAYER_NAMES.controlUI} behind the nginx mTLS bridge.`,
      details: [
        ["Owner", "Customer (BYOA)"],
        ["Platform", "nginx bridge on OpenShift"],
        ["ADR", "0011"]
      ]
    },
    oc: {
      title: `${LAYER_NAMES.openClaw} — ${LAYER_NAMES.harness}`,
      description: "Runs inside the Agent Sandbox. The customer brings the agent; Red Hat isolates, observes, and governs it.",
      details: [
        ["Owner", "Customer"],
        ["Product", "Not Red Hat"],
        ["Runs in", "Agent Sandbox"]
      ]
    },
    landlock: {
      title: "Landlock filesystem policy",
      description: "Inside the Agent Sandbox. Landlock blocks /etc/shadow and secrets from minute zero.",
      details: [
        ["Owner", "Red Hat Agent Sandbox"],
        ["State", "Locked"],
        ["Policy", "config/openshell/default.yaml"]
      ]
    },
    ir: {
      title: LAYER_NAMES.ir,
      description: `OpenShell inference router. Injects the MaaS API key — the agent process never sees it.`,
      details: [
        ["Owner", "NVIDIA OpenShell on OpenShift"],
        ["Path", DIRECT_INFERENCE_PATH]
      ]
    },
    gw: {
      title: "OpenShell Gateway",
      description: `Choke point inside OpenShell. User entry via ${LAYER_NAMES.controlUI}; all sandbox egress goes through the gateway.`,
      details: [
        ["Owner", "NVIDIA OpenShell on OpenShift"],
        ["Role", "Egress + inference router"],
        ["Policy", "nftables / network_policies"]
      ]
    },
    nemo: {
      title: "NeMo Guardrails",
      description: "Input/output rails on the inference hop. Off at demo start; enabled live in Cambio 2 (Test D).",
      details: [
        ["Product", "RHOAI · TrustyAI"],
        ["Rails", "NVIDIA NeMo Guardrails"],
        ["ADR", "0004"]
      ]
    },
    maas: {
      title: "Models as a Service",
      description: "Serving gateway. Calls the LLM — the agent never talks to the model directly.",
      details: [
        ["Product", "RHOAI"],
        ["Role", "Model serving gateway"]
      ]
    },
    llm: {
      title: "LLM",
      description: "The model MaaS calls. Last hop on the inference path.",
      details: [
        ["Served by", "MaaS"],
        ["Role", "LLM inference"]
      ]
    },
    internet: {
      title: LAYER_NAMES.internet,
      description: `Public egress. curl allowed in demo-initial policy (Test C) until Cambio 1.`,
      details: [
        ["Path", `${LAYER_NAMES.openClaw} → ${LAYER_NAMES.gw} → ${LAYER_NAMES.internet}`],
        ["Policy", "nftables / network_policies"]
      ]
    },
    mlflow: {
      title: LAYER_NAMES.mlflow,
      description: "One tracking server. Agent traces from the first token (mlflow-openclaw plugin).",
      details: [
        ["Product", "RHOAI · MLflow"],
        ["ADR", "0010"]
      ]
    }
  },
  flows: buildOverallFlows(),
  flowOrder: OVERALL_FLOW_ORDER,
  defaultFlow: "baseline",
  inspector: {
    initialStates: LAYER_BOARDS,
    mutations: buildOverallMutations(),
  },
  legend: [
    { label: `${LAYER_NAMES.endUser} · ${LAYER_NAMES.controlUI}`, color: "#79c0ff" },
    { label: "Public egress (risk)", color: "#f78166" },
    { label: `${LAYER_NAMES.openClaw} · ${LAYER_NAMES.harness}`, color: "#f0883e" },
    { label: "Agent Sandbox", color: "#d2a8ff" },
    { label: "Inference request", color: "#58a6ff" },
    { label: "OpenShell Gateway", color: "#1f6feb" },
    { label: "NeMo Guardrails", color: "#2dd4bf" },
    { label: "Inference response", color: "#3fb950" },
    { label: "File policy (Landlock)", color: "#c9d1d9" },
    { label: "MLflow traces", color: "#e3b341" }
  ],
};

try {
  await initScenarioDiagram(diagram, {
    headerTitle: "AgentOps - Platform Architecture",
    renderNav: { base: "overall", inPanel: true },
    overallNav: true,
    showFlowSelect: true,
    defaultMode: "baseline",
    phaseRest: PHASE_REST,
    flowShortcuts: OVERALL_FLOW_SHORTCUTS,
    inspectorBodyLabelDefault: "Scenario",
    responseComparison: buildOverallResponseComparison(),
  });
} catch (e) {
  console.error("FlowStory load error:", e);
  document.body.innerHTML = `<pre style="padding:24px;color:#f85149">FlowStory load error\n${e.message}\n\n${e.stack || ""}</pre>`;
}
</script>
</body>
</html>
