<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>AgentOps - Platform Architecture</title>
<link rel="stylesheet" href="./shared/vendor/style.css">
<link rel="stylesheet" href="./shared/demo.css">
</head>
<body>

<button class="fs-theme-toggle" id="fs-theme" title="Toggle theme">&#9790;</button>

<div class="fs-brand" id="fs-brand"></div>
<div class="fs-header-stack" id="fs-header-stack">
  <div class="fs-title" id="fs-title"></div>
  <div class="fs-tagline">Your Agent. Our Platform. Production-Ready.</div>
</div>

<div class="fs-top-dock" id="fs-top-dock">
  <div class="fs-panel">
    <div class="fs-flow-bar">
      <div class="fs-flow-nav">
        <select id="fs-flow-select"></select>
        <button id="fs-prev" title="Previous hop (clicker / ← / Page Up)">&#9664;</button>
        <button class="fs-start" id="fs-play">&#9654; Start</button>
        <button id="fs-next" title="Next hop (clicker / → / Page Down)">&#9654;</button>
      </div>
      <button id="fs-speed">1x</button>
      <button id="fs-loop">&#8635; Loop</button>
      <button id="fs-layers-toggle" type="button" title="Cycle layers panel: Right → Off → Top → Bottom">Layers: Right</button>
      <button class="fs-reset" id="fs-reset">Reset</button>
    </div>
  </div>
</div>

<div class="fs-layers-dock" id="fs-layers-dock">
  <div id="fs-layers-stack" class="fs-layers-stack">
    <div class="fs-steps" id="fs-steps">
      <div class="fs-steps-title">Layers <span class="fs-steps-hint">· clicker or ← →</span></div>
      <div id="fs-steps-container"></div>
    </div>
    <div class="fs-inspector" id="fs-inspector">
      <div class="fs-inspector-title" id="fs-inspector-title">Layer board</div>
      <div id="fs-inspector-content"></div>
    </div>
  </div>
</div>

<div id="fs-highlight-box"></div>
<div id="fs-overlay" onclick="if(event.target===this)window.__flowstory?.closeOverlay()">
  <div id="fs-overlay-card">
    <button id="fs-overlay-close" type="button" aria-label="Close">✕</button>
    <div id="fs-overlay-accent"></div>
    <h2 id="fs-overlay-title"></h2>
    <p id="fs-overlay-desc"></p>
    <div id="fs-overlay-details"></div>
    <button id="fs-overlay-resume" type="button">&#9654; Resume</button>
  </div>
</div>

<div class="fs-legend fs-legend--diagram-inset" id="fs-legend"></div>
<div class="fs-credit">Complete platform · <a href="./index.html">launcher</a></div>

<canvas id="fs-canvas"></canvas>

<script type="module">
import { initScenarioDiagram, OVERALL_FLOW_SHORTCUTS } from './scenarios/shared-scenario.js';
import { buildOverallResponseComparison, PHASE_REST } from './scenarios/overall-flows.js';
import { buildOverallDiagram } from './scenarios/overall-diagram-config.js';

const diagram = buildOverallDiagram();

try {
  await initScenarioDiagram(diagram, {
    headerTitle: "AgentOps - Platform Architecture",
    showFlowSelect: true,
    defaultMode: "baseline",
    phaseRest: PHASE_REST,
    flowShortcuts: OVERALL_FLOW_SHORTCUTS,
    inspectorBodyLabelDefault: "Scenario",
    responseComparison: buildOverallResponseComparison(),
  });
} catch (e) {
  console.error("FlowStory load error:", e);
  document.body.innerHTML = `<pre class="fs-load-error">FlowStory load error\n${e.message}\n\n${e.stack || ""}</pre>`;
}
</script>
</body>
</html>
