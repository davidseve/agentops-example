version: 1

# Variant of default.yaml with demo_egress_google — curl to google.com for Test C (post–Change 1).
# Apply live via demo-allow-google-egress.sh; demo-reset.sh switches back to default.yaml.

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /sandbox]
  read_write: [/sandbox/workspace, /tmp, /dev/null, /home]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # LLM inference: handled by OpenShell's inference router (inference.local).

  mlflow_direct:
    name: rhoai-mlflow-direct-traces
    endpoints:
      - host: "mlflow.redhat-ods-applications.svc"
        port: 8443
        protocol: rest
        enforcement: enforce
        access: read-write
        tls: skip
    # node: OpenClaw gateway + mlflow-openclaw trace export (not curl — validation uses oc exec)
    binaries:
      - { path: /usr/bin/node }

  demo_egress_google:
    name: demo-permissive-google
    endpoints:
      - host: "google.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/curl }
