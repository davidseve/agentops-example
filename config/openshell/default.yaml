version: 1

# Default OpenShell sandbox policy: MLflow traces only; no public egress.
# Default POLICY_FILE in launch-openclaw.sh, CI validate-security, demo-reset,
# and demo backstage (Test C before Change 1). Post–Change 1 google egress:
# config/openshell/google-egress.yaml via demo-allow-google-egress.sh.

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /sandbox]
  read_write: [/sandbox/workspace, /tmp, /dev/null, /home]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # LLM inference: handled by OpenShell's inference router (inference.local).
  # No explicit network policy needed — inference.local traffic is internal
  # to the OpenShell proxy. Provider credentials injected at the gateway layer.

  mlflow_direct:
    name: rhoai-mlflow-direct-traces
    endpoints:
      - host: "mlflow.redhat-ods-applications.svc"
        port: 8443
        protocol: rest
        enforcement: enforce
        access: read-write
        tls: skip
    # node: OpenClaw gateway + mlflow-openclaw trace export (not curl — validation uses oc exec)
    binaries:
      - { path: /usr/bin/node }
