# PR/push checks — no cluster or secrets required.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static checks + unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for secret patterns
        run: bash scripts/ci-secret-scan.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Validate demo UI (CSS + unit tests)
        run: ./scripts/validate-demo-ui.sh

      - name: Export README architecture diagram
        run: ./scripts/export-readme-architecture.sh

      - name: Upload exported architecture diagram (debug)
        uses: actions/upload-artifact@v4
        with:
          name: exported-architecture-png
          path: assets/overall-architecture.png
          if-no-files-found: error

      - name: Verify architecture diagram is up to date
        run: git diff --exit-code assets/overall-architecture.png

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint and template
        run: make -C deploy lint template
